<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071321">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>CZone Circuits</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06101d;
      --panel: #0b1a2b;
      --panel-2: #0f2237;
      --panel-3: #122a43;
      --line: rgba(148, 193, 235, .15);
      --text: #edf6ff;
      --muted: #8fa7be;
      --blue: #38a9ff;
      --cyan: #18d5e8;
      --green: #31d58a;
      --amber: #ffc34d;
      --purple: #bd78ff;
      --red: #ff6b7d;
      --shadow: 0 18px 45px rgba(0,0,0,.28);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at 70% -10%, #123152 0, var(--bg) 42%); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { overflow-x: hidden; }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { display: grid; grid-template-columns: 250px minmax(0, 1fr) 285px; min-height: 100vh; }
    .leftwell { display: contents; }
    .sidebar { grid-column:1; grid-row:1; }
    .main { grid-column:2; grid-row:1; }
    .rightbar { grid-column:3; grid-row:1; }
    .sidebar, .rightbar { background: rgba(5, 16, 29, .78); backdrop-filter: blur(18px); border-color: var(--line); }
    .sidebar { border-right: 1px solid var(--line); padding: 22px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .rightbar { border-left: 1px solid var(--line); padding: 22px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .brand { display:flex; align-items:center; gap:11px; padding: 2px 10px 25px; }
    .brand-mark { width:38px; height:38px; display:block; object-fit:contain; border-radius:10px; box-shadow: 0 8px 25px rgba(31,154,255,.24); }
    .brand strong { display:block; font-size:17px; letter-spacing:.2px; }
    .brand span { color:var(--muted); font-size:12px; }
    .nav { display:grid; gap:5px; }
    .nav button, .category-nav button { width:100%; border:0; background:transparent; padding:10px 11px; border-radius:11px; display:flex; align-items:center; gap:11px; text-align:left; cursor:pointer; color:#c6d6e7; }
    .nav button:hover, .category-nav button:hover { background: rgba(55,143,215,.12); }
    .nav button.active { background: linear-gradient(90deg, rgba(21,139,229,.30), rgba(21,139,229,.10)); color:white; }
    .nav-icon { width:22px; text-align:center; opacity:.95; }
    .nav-count { margin-left:auto; color:var(--muted); font-size:12px; }
    .separator { height:1px; background:var(--line); margin:16px 7px; }
    .section-label { color:#7891aa; font-size:11px; text-transform:uppercase; letter-spacing:1.2px; padding: 0 10px 8px; }
    .category-nav { display:grid; grid-template-columns:1fr; gap:8px; }
    .category-nav .category-card { width:100%; min-height:64px; padding:10px; border-radius:14px; }
    .category-nav .category-card .cat-icon { width:34px; height:34px; border-radius:10px; font-size:17px; flex:0 0 34px; }
    .category-nav .category-card strong { font-size:12px; }
    .category-nav .category-card span { font-size:10px; }
    .category-nav .category-card.active { background:linear-gradient(145deg,rgba(20,104,168,.42),rgba(10,38,62,.94)); border-color:rgba(38,188,255,.65); box-shadow:inset 0 0 0 1px rgba(38,188,255,.14); }
    .main { min-width:0; padding: 24px 20px 42px; }
    .hero { min-height:154px; border:1px solid var(--line); border-radius:22px; padding:27px 28px; position:relative; overflow:hidden; background-image: linear-gradient(90deg, rgba(5,20,36,.96) 0%, rgba(7,25,43,.84) 45%, rgba(7,25,43,.38) 100%), url('hero-bg.jpg'); background-size:cover; background-position:center; box-shadow:var(--shadow); }
    .hero:after { content:""; position:absolute; top:0; right:0; bottom:0; left:0; background:linear-gradient(180deg, rgba(4,16,29,.12), rgba(4,16,29,.32)); pointer-events:none; }
    .hero h1, .hero p { position:relative; z-index:1; }
    .hero h1 { margin:0; font-size:30px; line-height:1.15; letter-spacing:-.7px; }
    .hero p { margin:9px 0 0; color:#a9c2d9; font-size:14px; }
    .search { position:relative; }
    .search input { width:100%; border:1px solid var(--line); background:#0b1d30; color:white; border-radius:999px; padding:11px 15px 11px 38px; outline:none; }
    .search input:focus { border-color:rgba(56,169,255,.65); box-shadow:0 0 0 3px rgba(56,169,255,.10); }
    .search span { position:absolute; left:14px; top:9px; color:#7895ad; }
    .category-card { border:1px solid var(--line); border-radius:14px; background:linear-gradient(145deg,rgba(18,45,70,.88),rgba(10,28,46,.88)); padding:13px; cursor:pointer; min-height:70px; display:flex; align-items:center; gap:11px; }
    .category-card:hover { transform:translateY(-1px); border-color:rgba(71,171,238,.42); }
    .category-card.active { border-color:rgba(38,188,255,.65); box-shadow:inset 0 0 0 1px rgba(38,188,255,.14); }
    .cat-icon { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:color-mix(in srgb, var(--cat) 16%, transparent); color:var(--cat); font-size:19px; }
    .category-card strong { font-size:13px; display:block; }
    .category-card span { color:var(--muted); font-size:11px; }
    .section { border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:rgba(8,24,40,.78); box-shadow:var(--shadow); }
    .section-head { padding:15px 17px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); }
    .section-head h2 { margin:0; font-size:18px; letter-spacing:-.2px; }
    .section-head .subtle { color:var(--muted); font-size:12px; }
    .section-head .search { margin-left:auto; flex:0 1 280px; min-width:180px; max-width:280px; }
    .section-head .sort { margin-left:0; flex:0 0 auto; background:#0c2135; border:1px solid var(--line); color:#cbdbea; border-radius:9px; padding:7px 9px; }
    .circuit { display:grid; grid-template-columns:36px minmax(150px,1.5fr) minmax(120px,1fr) minmax(120px,1fr) 30px; gap:10px; align-items:center; padding:13px 15px; border-bottom:1px solid rgba(148,193,235,.10); min-height:76px; }
    .circuit:last-child { border-bottom:0; }
    .circuit:hover { background:rgba(44,115,170,.07); }
    .fav { border:0; background:transparent; cursor:pointer; color:#7890a6; font-size:18px; padding:4px; }
    .fav.on { color:#ffc34d; text-shadow:0 0 12px rgba(255,195,77,.25); }
    .circuit-name { min-width:0; }
    .circuit-name strong { display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .circuit-name small { display:block; color:#738ca4; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tags { display:flex; flex-wrap:wrap; gap:4px; }
    .tag { font-size:10px; padding:4px 7px; border-radius:999px; background:#152d44; color:#bdd1e3; }
    .tag.cat { background:color-mix(in srgb, var(--cat) 14%, #10263b); color:color-mix(in srgb, var(--cat) 82%, white); }
    .status { display:flex; align-items:center; gap:7px; font-size:11px; color:#a7bdd1; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:#6c8399; }
    .status.on { color:#64e4aa; }
    .status.on .status-dot { background:var(--green); box-shadow:0 0 12px rgba(49,213,138,.7); }
    .control { display:flex; align-items:center; gap:9px; justify-content:flex-end; }
    .toggle { min-width:78px; min-height:42px; padding:9px 15px; border:1px solid rgba(148,193,235,.22); border-radius:12px; background:#172b40; cursor:pointer; transition:background .14s, border-color .14s, transform .08s, opacity .14s; font-weight:750; letter-spacing:.5px; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
    .toggle:hover { filter:brightness(1.12); }
    .toggle:active { transform:translateY(1px); }
    .toggle.pending { opacity:.72; cursor:wait; box-shadow:0 0 0 3px rgba(84,199,255,.18); }
    .toggle:disabled { cursor:wait; }
    .sending { color:#54c7ff; font-size:10px; margin-left:5px; }
    .circuit-name strong.with-chip { display:flex; align-items:center; }
    .circuit-name strong.with-chip > span { min-width:0; overflow:hidden; text-overflow:ellipsis; }
    .temp-chip { flex:none; margin-left:8px; padding:2px 8px; border:1px solid rgba(255,159,88,.35); border-radius:999px; background:rgba(255,159,88,.10); color:#ffb884; font:inherit; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; cursor:pointer; vertical-align:1px; }
    .temp-chip small { display:inline; margin:0 0 0 2px; font-size:10px; font-weight:500; color:inherit; opacity:.8; }
    .temp-chip:hover { border-color:#ff9f58; }
    .toggle-amps { display:block; font-size:10px; font-weight:600; opacity:.85; letter-spacing:0; margin-top:1px; }
    .toggle.on { background:linear-gradient(135deg,#1cbd78,#168d5b); border-color:rgba(100,228,170,.55); color:#fff; }
    .toggle.off { background:#172b40; color:#c4d4e3; }
    .toggle.pending.on { background:linear-gradient(135deg,#249c70,#197d59); }
    .range-wrap { display:flex; align-items:center; gap:8px; min-width:135px; }
    input[type=range] { accent-color:#38a9ff; width:100%; cursor:pointer; }
    .percent { min-width:38px; text-align:right; font-size:11px; color:#c3d7e8; }
    .arrow { color:#59738b; font-size:19px; }
    .empty { padding:42px 20px; text-align:center; color:var(--muted); }
    .right-card { border:1px solid var(--line); border-radius:16px; background:rgba(10,29,47,.72); padding:16px; margin-bottom:13px; }
    .right-card h3 { margin:0 0 15px; font-size:15px; }
    .mode-grid { display:grid; gap:8px; }
    .mode-button { width:100%; border:1px solid var(--line); background:#0c2135; border-radius:12px; padding:12px 13px; cursor:pointer; text-align:left; transition:background .14s, border-color .14s, transform .08s, opacity .14s; }
    .mode-button:hover { border-color:rgba(56,169,255,.45); }
    .mode-button:active { transform:translateY(1px); }
    .mode-button.active { background:linear-gradient(135deg,#168eea,#2164b8); border-color:rgba(87,199,255,.65); color:white; box-shadow:0 7px 22px rgba(20,130,224,.18); }
    .mode-button.pending { opacity:.72; cursor:wait; box-shadow:0 0 0 3px rgba(84,199,255,.14); }
    .mode-name { display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:750; }
    .mode-state { color:var(--muted); font-size:10px; margin-top:4px; }
    .mode-button.active .mode-state { color:#d8f3ff; }
    .stat { display:flex; align-items:center; gap:11px; padding:8px 0; }
    .stat-icon { width:30px; height:30px; display:grid; place-items:center; border-radius:10px; background:#142e45; }
    .stat strong { display:block; font-size:17px; }
    .stat span { display:block; color:var(--muted); font-size:11px; }
    .connection { display:flex; justify-content:flex-end; align-items:center; gap:7px; color:#8fa7be; font-size:11px; padding:0 4px 12px; }
    .connection i { width:8px; height:8px; border-radius:50%; background:#ffb84d; }
    .connection.ok i { background:var(--green); box-shadow:0 0 10px rgba(49,213,138,.6); }
    .mobile-menu { display:none; }
    /* Responsive layout: keep every panel visible as the viewport narrows.
       Wide: three columns. Medium: the former right well moves beneath the left well.
       Narrow: navigation/status stack above the circuit list. */
    @media (max-width: 1180px) {
      /* Medium screens: the left navigation and status/actions are one independent
         scrolling column. The circuit area remains in its own document column. */
      .app { grid-template-columns:215px minmax(0,1fr); align-items:stretch; }
      .leftwell { grid-column:1; grid-row:1; display:flex; flex-direction:column; min-height:100vh; height:100vh; position:sticky; top:0; overflow-y:auto; overflow-x:hidden; scrollbar-gutter:stable; }
      .sidebar { position:static; height:auto; overflow:visible; flex:0 0 auto; }
      .rightbar { position:static; height:auto; overflow:visible; flex:0 0 auto; border-left:0; border-right:1px solid var(--line); padding:0 16px 22px; }
      .main { grid-column:2; grid-row:1; min-height:100vh; }
      .right-card:last-child { margin-bottom:0; }
    }
    @media (max-width: 780px) {
      /* Super-narrow screens use a deliberate top-to-bottom workflow:
         branding -> hero -> modes -> filters -> circuits -> status.  The
         wrappers become transparent so the major pieces can be ordered
         independently without changing the desktop/medium structure. */
      .app { display:grid; grid-template-columns:minmax(0,1fr); align-items:stretch; }
      .leftwell, .sidebar, .rightbar, .main { display:contents; }
      .brand { grid-column:1; order:1; padding:10px 22px 0; }
      .hero { grid-column:1; order:2; margin:12px 12px 0; padding:21px; }
      .hero h1 { font-size:25px; }
      .modes-card { grid-column:1; order:3; margin:12px 12px 0; }
      .nav { grid-column:1; order:4; display:grid; margin:12px 12px 0; }
      .sidebar > .separator:nth-of-type(3) { grid-column:1; order:5; margin:10px 19px 8px; }
      .section-label { grid-column:1; order:6; margin:0 12px; }
      .category-nav { grid-column:1; order:7; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin:0 12px; }
      .sidebar > .separator:nth-of-type(6) { grid-column:1; order:8; margin:10px 19px 0; }
      .section { grid-column:1; order:9; margin:12px 12px 0; }
      .overview-card { grid-column:1; order:10; margin:12px 12px 0; }
      .rightbar > .right-card:last-child { grid-column:1; order:11; margin:12px 12px 12px; }
      .main > .connection { display:none; }
      .category-nav .category-card { min-height:58px; padding:9px; }
      .category-nav .category-card .cat-icon { width:30px; height:30px; flex-basis:30px; }
      .section-head { flex-wrap:wrap; }
      .section-head .search { margin-left:auto; flex:1 1 180px; min-width:180px; max-width:none; }
      .section-head .sort { margin-left:auto; }
      .circuit { grid-template-columns:30px minmax(0,1fr) auto; }
      .tags { display:none; }
      .status { display:none; }
      .control { grid-column:2 / 4; justify-content:stretch; }
      .range-wrap { flex:1; }
    }

    @media (min-width: 781px) and (max-width: 1180px) {
      /* Medium widths have less horizontal room for the decorative ACTIVE
         label. Let long mode names use the full button width and wrap safely. */
      .mode-name { min-width:0; }
      .mode-name > span:first-child { min-width:0; overflow-wrap:anywhere; }
      .mode-name > span:last-child { display:none; }
    }

    /* [fork] Chartplotter layout. A Navico plotter (B&G / Simrad / Lowrance)
       shows the page in its own browser, Chromium 69, driven by touch that
       arrives as mouse events. It has no flex gap, no colour-mix, few symbol
       fonts and no hover; a drag selects text instead of scrolling. The page
       gets the class "mfd" when the plotter's own parameters are on the address
       (or ?layout=mfd, for trying it in a desktop browser). Nothing here
       applies anywhere else. */
    .mfd, .mfd * { -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
    .mfd input[type=search] { -webkit-user-select:text; user-select:text; }
    .mfd body { font-size:16px; }
    .mfd svg.ico { width:22px; height:22px; display:block; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .mfd .app { grid-template-columns:230px minmax(0,1fr); }
    .mfd .hero, .mfd .overview-card, .mfd .rightbar > .right-card:last-child, .mfd #sectionIcon, .mfd .search > span { display:none; }
    .mfd .modes-card.none { display:none; }
    .mfd .main { padding:10px 12px 30px; }
    .mfd .connection { padding:0 4px 8px; }
    .mfd .sidebar { padding:12px 10px; }
    .mfd .rightbar { padding:0 10px 14px; }
    .mfd .brand { padding:2px 8px 12px; }
    .mfd .brand > * + *, .mfd .category-card > * + * { margin-left:11px; }
    .mfd .nav button { min-height:50px; font-size:16px; padding:10px 12px; margin-bottom:4px; }
    .mfd .nav-icon { width:24px; margin-right:12px; flex:none; }
    .mfd .nav-count { font-size:14px; }
    .mfd .category-nav .category-card { min-height:60px; margin-bottom:6px; }
    .mfd .category-nav .category-card strong { font-size:14px; }
    .mfd .category-nav .category-card span { font-size:12px; }
    .mfd .cat-icon { background:rgba(120,170,220,.14); }
    .mfd .section-head { padding:12px 14px; }
    .mfd .section-head > * + * { margin-left:10px; }
    .mfd .section-head .search { margin-left:auto; }
    .mfd .leftwell { background:rgba(5,16,29,.78); border-right:1px solid var(--line); }
    .mfd .sidebar, .mfd .rightbar { background:none; border:0; }
    .mfd .section-head h2 { font-size:20px; }
    .mfd .section-head .subtle { font-size:13px; }
    .mfd .search input { padding:12px 15px; font-size:15px; }
    .mfd .section-head .sort { padding:11px 10px; font-size:14px; }
    .mfd .circuit { grid-template-columns:44px minmax(0,1fr) auto 34px; min-height:74px; padding:10px 12px; }
    .mfd .tags, .mfd .status { display:none; }
    .mfd .circuit > div:nth-last-child(2) { justify-self:end; }
    .mfd .fav { font-size:24px; padding:8px; }
    .mfd .circuit-name strong { font-size:17px; }
    .mfd .circuit-name small { font-size:12px; }
    .mfd .temp-chip { font-size:14px; padding:3px 9px; }
    .mfd .toggle { min-width:104px; min-height:54px; font-size:17px; }
    .mfd .toggle-amps { font-size:12px; }
    .mfd .control > * + *, .mfd .range-wrap > * + * { margin-left:9px; }
    .mfd .connection > * + * { margin-left:7px; }
    .mfd .arrow { font-size:26px; padding:8px 4px; }
    .mfd .mode-button { min-height:50px; font-size:15px; }
    .mfd .empty { font-size:15px; }
    /* Cheap to draw: the plotter redraws the page in software as it scrolls. */
    .mfd, .mfd body { background:#06101d; }
    .mfd * { box-shadow:none !important; text-shadow:none !important; transition:none !important; }
    .mfd .section { background:#0a1a2b; }
    .mfd .leftwell { background:#07121f; }
    .mfd .toggle.on { background:#1aa56a; }
    .mfd .nav button.active { background:#12456e; }
    .mfd .category-card, .mfd .category-nav .category-card.active { background:#0f2740; }
    .mfd .category-card:hover { transform:none; }
    .mfd .circuit:hover, .mfd .nav button:hover, .mfd .category-nav button:hover { background:transparent; }
    .mfd .nav button.active:hover { background:#12456e; }
    .mfd-probe { position:fixed; left:8px; bottom:8px; z-index:9; margin:0; padding:8px 10px; max-width:70%; font:12px/1.35 monospace; color:#d6f5d6; background:rgba(0,0,0,.88); border:1px solid #2c6; border-radius:8px; white-space:pre; pointer-events:none; }
  </style>
  <link rel="stylesheet" href="monitor.css">
</head>
<body>
  <div class="app">
    <div class="leftwell">
    <aside class="sidebar">
      <div class="brand"><img class="brand-mark" src="icon.png" alt="CZone" width="38" height="38"><div><strong>CZone</strong><span>Boat Systems</span></div></div>
      <div class="nav" id="mainNav"></div>
      <div class="separator"></div>
      <div class="section-label">Categories</div>
      <div class="category-nav" id="categoryNav"></div>
      <div class="separator"></div>
    </aside>

    <aside class="rightbar">
      <div class="right-card modes-card"><h3>Modes</h3><div id="modes" class="mode-grid"></div></div>
      <div class="right-card overview-card"><h3>System Overview</h3><div id="stats"></div></div>
      <div class="right-card"><h3>Connection</h3><div id="connectionCard"></div></div>
    </aside>
    </div>

    <main class="main">
      <div class="connection" id="connection"><i></i><span>Connecting to Signal K…</span></div>
      <section class="hero">
        <h1 id="heroTitle">Your Boat, Your Circuits</h1>
        <p>Monitor and control your boat's electrical systems.</p>
      </section>
      <section class="section">
        <div class="section-head"><span id="sectionIcon">⚡</span><div><h2 id="sectionTitle">All Circuits</h2><span class="subtle" id="sectionCount"></span></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search circuits…" autocomplete="off"></label><select class="sort" id="sort"><option value="name">A–Z</option><option value="state">In Use</option><option value="brightness">Brightness</option></select></div>
        <div id="circuits"></div>
      </section>
    </main>

  </div>
<script>
(() => {
  const OWN_SCRIPT = document.currentScript ? document.currentScript.textContent : null; // see "a newer page" below
  const API = '/plugins/signalk-czone-circuits';

      return true;
    }
    const cur = /^electrical\.czone\.([^\.]+)\.current$/.exec(path || '');
    if (cur) {
      const c = circuitBySlug(cur[1]);
      if (!c || typeof value !== 'number' || c.current === value) return false;
      c.current = value;
      return true;
    }
    const m = /^electrical\.czone\.([^\.]+)\.switch\.(state|brightness)$/.exec(path || '');
    if (!m) return false;
    const c = circuitBySlug(m[1]);
    if (!c) { console.debug('[CZone WS] unmatched circuit path', path, value); return false; }
    c.state = c.state || {};
    const sourceLabel = source && (source.label || source.type || source.src) ? JSON.stringify(source) : 'none';
    if (m[2] === 'state') {
      const observed = value === true || value === 1 || value === 'ON' || value === 'on';
      const observedState = observed ? 'ON' : 'OFF';
      const p = pending.get(nameKey(c));
      console.debug('[CZone WS] STATE', c.name, observedState, 'raw=', value, 'source=', sourceLabel, 'timestamp=', timestamp || 'none', p ? `pending=${p.requested}` : 'pending=none');
      // A command is optimistic until CZone confirms it. Do not let a stale
      // conflicting WebSocket value immediately undo the user's click.
      if (p && p.kind === 'state' && observedState !== p.requested) {
        console.debug('[CZone WS] STATE ignored while pending', c.name, 'observed=', observedState, 'requested=', p.requested);
        return true;
      }
      c.state.state = observedState;
      const wasPending = !!p;
      clearPending(c, 'state', observedState);
      if (wasPending) console.debug('[CZone UI] STATE CONFIRMED via WebSocket', c.name, observedState);
    } else {
      const observed = Math.round(Number(value) * 100);
      if (!Number.isFinite(observed)) { console.debug('[CZone WS] invalid brightness', c.name, value); return false; }
      console.debug('[CZone WS] BRIGHTNESS', c.name, observed + '%', 'raw=', value);
      c.state.percent = observed;
      clearPending(c, 'brightness', observed);
    }
    return true;
  }

  function mergeRest(data) {
    const incoming = data.circuits || [];
    if (!circuits.length) circuits = incoming;
    else {
      const bySlug = new Map(incoming.map(c => [c.slug, c]));
      circuits = circuits.map(c => {
        const fresh = bySlug.get(c.slug);
        if (!fresh) return c;
        const p = pending.get(nameKey(c));
        return { ...fresh, state: p ? c.state : (fresh.state || c.state) };
      });
    }
    status = data;
    if (Array.isArray(data.modes)) modes = data.modes;
    if (data.activeMode) activeMode = data.activeMode;
  }
  // [fork] Signal K refused the plugin's data: nobody is logged in at this
  // address (a login is kept per address, so venus.local and the IP address
  // are separate). The page used to sit empty with "Connected" in the corner.
  let needLogin = false;
  function showLoginNeeded() {
    needLogin = true;
    const c = document.querySelector('#connection');
    c.classList.remove('ok');
    c.innerHTML = '<i></i><span>Not logged in to Signal K</span>';
    renderNav();
    const el = document.querySelector('#circuits');
    if (el && !circuits.length) patch(el, MFD
      ? '<div class="empty">Signal K refused the request. On a chartplotter the login comes from the Navico embedder plugin: generate its authentication token and save.</div>'
      : '<div class="empty">Signal K needs a login to show the circuits. <a href="/admin/#/login" style="color:#54c7ff">Log in</a>, then reload this page.</div>');
  }
  async function refreshOnce(reason = 'manual') {
    try {
      const r = await fetch(`${API}/circuits`, { cache:'no-store', credentials:'include' });
      if (r.status === 401 || r.status === 403) { showLoginNeeded(); return false; }
      if (!r.ok) throw new Error('Signal K plugin unavailable');
      const data = await r.json();
      needLogin = false;
      mergeRest(data);
      document.querySelector('#connection').classList.add('ok');
      document.querySelector('#connection').innerHTML = '<i></i><span>Connected · live circuit data</span>';
      render();
      return true;
    } catch (e) {
      document.querySelector('#connection').classList.remove('ok');
      document.querySelector('#connection').innerHTML = '<i></i><span>Waiting for Signal K…</span>';
      return false;
    }
  }
  async function refreshVesselName() {
    try {
      const r = await fetch('/signalk/v1/api/vessels/self/name', { cache:'no-store', credentials:'include' });
      if (!r.ok) return;
      const data = await r.json();
      const nextName = typeof data === 'string' ? data.trim() : (typeof data.value === 'string' ? data.value.trim() : '');
      if (nextName) { vesselName = nextName; renderHero(); }
    } catch (_) {}
  }

  async function post(path, body, circuit, kind, requested, previous) {
    setPending(circuit, kind, requested, previous);
    render();
    try {
      const r = await fetch(`${API}${path}`, { method:'POST', credentials:'include', headers: body ? {'Content-Type':'application/json'} : undefined, body: body ? JSON.stringify(body) : undefined });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Command failed');
      // HTTP 200 means the command was accepted by Signal K. CZone confirmation
      // normally comes from the WebSocket delta. A short, command-only REST
      // reconciliation is a fallback in case the browser misses that delta; it
      // does not run while idle and does not replace the server-side cache.
      console.debug('[CZone UI] command accepted', circuit.name, kind, requested, 'WebSocket confirmation pending');
      startPendingReconciliation(circuit, kind);
      render();
    } catch (e) {
      rollbackPending(circuit, kind);
      render();
      alert(e.message);
    }
  }
  window.toggleCircuit = (name, on) => {
    const c = circuits.find(x => x.name === decodeURIComponent(name)); if (!c) return;
    const existing = pending.get(nameKey(c));
    if (existing && existing.kind === 'state') { console.debug('[CZone UI] duplicate state click ignored', c.name); return; }
    c.state = c.state || {};
    const previous = c.state.state || 'OFF';
    c.state.state = on ? 'ON' : 'OFF';
    post(`/circuits/${name}/${on?'on':'off'}`, null, c, 'state', on ? 'ON' : 'OFF', previous);
  };
  window.setLevel = (name, value) => {
    const c = circuits.find(x => x.name === decodeURIComponent(name)); if (!c) return;
    c.state = c.state || {};
    const requested = Math.max(10, Number(value));
    const previous = Number.isFinite(c.state.percent) ? c.state.percent : 100;
    c.state.percent = requested;
    post(`/circuits/${name}/level`, { percent: requested }, c, 'brightness', requested, previous);
  };
  window.toggleFavorite = key => { favorites.has(key) ? favorites.delete(key) : favorites.add(key); saveFavorites(); render(); };

  function renderModes() {
    const el = document.querySelector('#modes');
    if (!el) return;
    if (el.parentElement) el.parentElement.classList.toggle('none', !modes.length); // hidden on a plotter when there are none
    if (!modes.length) { patch(el, '<div class="empty" style="padding:10px 4px">No CZone modes found.</div>'); return; }
    patch(el, modes.map(m => {
      const active = activeMode && activeMode.slug === m.slug;
      const pending = modePending && modePending.slug === m.slug;
      return `<button type="button" class="mode-button ${active?'active':''} ${modePending?'pending':''}" ${modePending?'disabled':''} onclick="activateMode('${encodeURIComponent(m.slug)}')" aria-busy="${pending?'true':'false'}"><div class="mode-name"><span>${esc(m.name === 'Day Crusing' ? 'Day Cruising' : m.name)}</span><span>${pending?'Sending…':active?'ACTIVE':' '}</span></div><div class="mode-state">${active?'Current operating mode':'Select mode'}</div></button>`;
    }).join(''));
  }

  window.activateMode = function (slug) {
    const decoded = decodeURIComponent(slug);
    const mode = modes.find(m => m.slug === decoded);
    if (!mode || modePending) return;
    const previous = activeMode;
    activeMode = mode;
    modePending = { slug: mode.slug, previous: previous };
    renderModes();
    fetch(`${API}/modes/${encodeURIComponent(mode.slug)}/activate`, { method:'POST', credentials:'include' })
      .then(async r => { const data = await r.json(); if (!r.ok) throw new Error(data.error || 'Mode command failed'); })
      .catch(err => { activeMode = previous; modePending = null; renderModes(); alert(err.message); });
  };

  function renderHero() {
    const name = (vesselName || '').trim();
    document.querySelector('#heroTitle').textContent = name ? `${name}’s Circuits` : 'Your Boat, Your Circuits';
  }

  function renderStats() {
    const on=activeCount(), total=circuits.length, fav=circuits.filter(c=>favorites.has(nameKey(c))).length;
    patch(document.querySelector('#stats'), `<div class="stat"><div class="stat-icon">⚡</div><div><strong>${total}</strong><span>Total Circuits</span></div></div><div class="stat"><div class="stat-icon">●</div><div><strong>${on}</strong><span>In Use</span></div></div><div class="stat"><div class="stat-icon">○</div><div><strong>${total-on}</strong><span>Off</span></div></div><div class="stat"><div class="stat-icon">★</div><div><strong>${fav}</strong><span>Favorites</span></div></div>`);
    const n2kReady = status.nmeaReady === true;
    const readyColor = n2kReady ? '#64e4aa' : '#ffcc77';
    const readyText = n2kReady ? 'NMEA 2000 output ready' : 'NMEA 2000 output waiting';
    const lastOut = status.lastNmeaOutput ? `<br><span style="color:#7f97ad">Last command: ${esc(status.lastNmeaOutput.circuit)} · ${esc(status.lastNmeaOutput.description)}</span>` : '';
    patch(document.querySelector('#connectionCard'), `<div style="color:#a9bfd2;font-size:12px;line-height:1.7"><span style="color:${status.sendingEnabled?'#64e4aa':'#ffcc77'}">● NMEA 2000 sending ${status.sendingEnabled?'enabled':'disabled'}</span><br><span style="color:${readyColor}">● ${readyText}</span>${lastOut}</div>`);
  }

  function render() { renderNav(); renderCategories(); renderCircuits(); renderStats(); renderModes(); renderHero(); }

  // [fork] Scrolling on a chartplotter. Its touch arrives as mouse events, so a
  // drag would select text and nothing would scroll. So a press that moves
  // more than a few pixels scrolls the nearest scrolling box (the list or the
  // left column). Positions are applied once per frame, and the tap that ends
  // a drag is not passed on as a click.
  // The plotter is slow, so redraws caused by live data wait while a finger is
  // down (see liveRender).
  let mfdBusyUntil = 0; // no data-driven redraw before this time
  if (MFD) {
    let drag = null, swallow = false, frame = 0;
    const scrollerOf = el => {
      for (let n = el; n && n !== document.body && n !== document.documentElement; n = n.parentElement) {
        const oy = getComputedStyle(n).overflowY;
        if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 1) return n;
      }
      return document.scrollingElement || document.documentElement;
    };
    const applyDrag = () => { frame = 0; if (drag && drag.moved) drag.box.scrollTop = drag.want; };
    document.addEventListener('mousedown', e => {
      if (e.button !== 0 || (e.target.closest && e.target.closest('input, select, canvas'))) return;
      const box = scrollerOf(e.target);
      drag = { box, y: e.clientY, top: box.scrollTop, want: box.scrollTop, moved: false, held: false };
      mfdBusyUntil = Date.now() + 1500;
    }, true);
    document.addEventListener('mousemove', e => {
      if (!drag) return;
      // Released outside the page. Only trusted once this drag has reported a
      // held button, since some touch layers never report one.
      if (e.buttons) drag.held = true; else if (drag.held) { endDrag(); return; }
      const dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dy) < 10) return;
      drag.moved = true;
      drag.want = drag.top - dy;
      mfdBusyUntil = Date.now() + 1500;
      if (!frame) frame = requestAnimationFrame(applyDrag);
      e.preventDefault();
    }, true);
    function endDrag() {
      if (drag && drag.moved) { applyDrag(); swallow = true; setTimeout(() => { swallow = false; }, 80); }
      drag = null;
      mfdBusyUntil = Date.now() + 400;
    }
    document.addEventListener('mouseup', endDrag, true);
    window.addEventListener('blur', endDrag);
    document.addEventListener('click', e => { if (swallow) { e.stopPropagation(); e.preventDefault(); swallow = false; } }, true);
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => { if (!(e.target.closest && e.target.closest('input'))) e.preventDefault(); });

    // A newer page. The plotter keeps showing the page it first loaded, even
    // after the tile is closed and reopened, so an update never appeared
    // without restarting the plotter. Once a minute the page fetches itself
    // and, if its own script has changed on the server, reloads. One attempt
    // per version, so a plotter that will not let go cannot loop.
    const checkPage = async () => {
      try {
        if (!OWN_SCRIPT) return;
        const r = await fetch(location.pathname + '?fresh=' + Date.now(), { cache: 'no-store', credentials: 'include' });
        if (!r.ok) return;
        const text = await r.text();
        const found = text.split('<scr' + 'ipt>').map(part => part.split('</scr' + 'ipt>')[0]).find(part => part.indexOf("const API = '/plugins/signalk-czone-circuits'") >= 0);
        if (!found || found === OWN_SCRIPT) return;
        const tried = String(found.length) + ':' + found.slice(-200).length + ':' + found.split('\n').length;
        let before = null;
        try { before = sessionStorage.getItem('czone-reload'); sessionStorage.setItem('czone-reload', tried); } catch (_) { return; }
        if (before !== tried) location.reload(true);
      } catch (_) {}
    };
    setTimeout(checkPage, 15000);
    setInterval(checkPage, 60000);

    // What the plotter actually sends: five taps on the connection line show
    // the last input events and how long frames and redraws take. For
    // diagnosing a plotter we cannot connect a debugger to.
    let taps = [], probe = null;
    document.querySelector('#connection').addEventListener('click', () => {
      const now = Date.now();
      taps = taps.filter(t => now - t < 3000).concat(now);
      if (taps.length < 5) return;
      taps = [];
      if (probe) { probe.remove(); probe = null; return; }
      probe = document.createElement('pre');
      probe.className = 'mfd-probe';
      document.body.appendChild(probe);
      const log = [];
      let last = performance.now(), frames = [];
      const note = e => {
        const t = performance.now();
        log.push(`${String(Math.round(t - last)).padStart(5)} ms  ${e.type.padEnd(11)} b=${e.buttons === undefined ? '-' : e.buttons} ${e.pointerType || ''} ${e.touches ? 't' + e.touches.length : ''} ${e.deltaY !== undefined ? 'dy=' + Math.round(e.deltaY) : ''}`);
        last = t;
        if (log.length > 16) log.shift();
      };
      for (const type of ['mousedown', 'mousemove', 'mouseup', 'click', 'touchstart', 'touchmove', 'touchend', 'pointerdown', 'pointermove', 'pointerup', 'wheel', 'scroll']) document.addEventListener(type, note, true);
      // Frame time: the gap between two frames in a row. Redraw: rebuilding the list.
      const tick = () => {
        if (!probe) return;
        requestAnimationFrame(t1 => requestAnimationFrame(t2 => {
          if (!probe) return;
          frames.push(t2 - t1);
          if (frames.length > 10) frames.shift();
          const t0 = performance.now(); renderCircuits(); const redraw = performance.now() - t0;
          probe.textContent = `${window.innerWidth}x${window.innerHeight}  frame ${Math.round(frames.reduce((a, b) => a + b, 0) / frames.length)} ms  redraw ${Math.round(redraw)} ms\n${navigator.userAgent.replace(/^.*(Chrome\/[\d.]+).*$/, '$1')}\n` + log.join('\n');
          setTimeout(tick, 700);
        }));
      };
      tick();
    });
  }
  // A redraw asked for by live data. Anywhere else it runs at once. On a
  // plotter it waits until no finger is down, and runs at most twice a second.
  let liveTimer = null, liveLast = 0;
  function liveRender() {
    if (!MFD) { render(); return; }
    if (liveTimer) return;
    const run = () => {
      const now = Date.now();
      const wait = Math.max(mfdBusyUntil - now, liveLast + 500 - now);
      if (wait > 0) { liveTimer = setTimeout(run, wait); return; }
      liveTimer = null; liveLast = now; render();
    };
    run();
  }

  document.querySelector('#search').addEventListener('input', e => { query=e.target.value.trim(); view=query?'search':'all'; category=null; render(); });
  document.querySelector('#sort').addEventListener('change', e => { sort=e.target.value; renderCircuits(); });

  function updateSocketIndicator(text, ok) {
    if (needLogin) return; // keep "Not logged in" until the list loads
    const el = document.querySelector('#connection');
    el.classList.toggle('ok', !!ok);
    el.innerHTML = `<i></i><span>${text}</span>`;
  }

  function sendSubscriptions() {
    if (!socket || socket.readyState !== WebSocket.OPEN || !circuits.length) return;
    const subscribe = [{ path: 'name', policy: 'instant' }, { path: 'electrical.czone.mode.active', policy: 'instant' }];
    for (const c of circuits) {
      subscribe.push({ path: `electrical.czone.${c.slug}.switch.state`, policy: 'instant' });
      if (c.capabilities && c.capabilities.dimmer) subscribe.push({ path: `electrical.czone.${c.slug}.switch.brightness`, policy: 'instant' });
      subscribe.push({ path: `electrical.czone.${c.slug}.current`, policy: 'instant' });
      if (c.temperatureTrend) subscribe.push({ path: `electrical.czone.${c.slug}.temperature`, policy: 'instant' });
    }
    console.debug('[CZone WS] subscribing to', subscribe.length, 'exact circuit paths');
    socket.send(JSON.stringify({ context:'vessels.self', subscribe }));
  }

  function scheduleWatchdog() {
    clearTimeout(watchdogTimer);
    const elapsed = lastSocketUpdateAt ? Date.now() - lastSocketUpdateAt : WS_WATCHDOG_MS;
    const wait = Math.max(1000, WS_WATCHDOG_MS - elapsed);
    watchdogTimer = setTimeout(async () => {
      if (!lastSocketUpdateAt || Date.now() - lastSocketUpdateAt >= WS_WATCHDOG_MS) {
        console.debug('[CZone WS] 120s watchdog fired; REST reconciliation');
        await refreshOnce('websocket-watchdog');
        lastSocketUpdateAt = Date.now();
      }
      scheduleWatchdog();
    }, wait);
  }

  function connectSocket() {
    if (!('WebSocket' in window)) { console.warn('[CZone WS] WebSocket unavailable'); return; }
    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
    try {
      console.debug('[CZone WS] connecting', SK);
      socket = new WebSocket(SK);
      socket.onopen = () => {
        socketConnected = true;
        lastSocketUpdateAt = Date.now();
        updateSocketIndicator('Connected · WebSocket live', true);
        sendSubscriptions();
        scheduleWatchdog();
      };
      socket.onmessage = ev => {
        try {
          const msg = JSON.parse(ev.data);
          if (!msg.updates) return;
          lastSocketUpdateAt = Date.now();
          let changed = false;
          let valuesSeen = 0;
          let circuitValues = 0;
          for (const update of msg.updates) {
            for (const v of (update.values || [])) {
              valuesSeen++;
              if (/^electrical\.czone\./.test(v.path || '')) circuitValues++;
              if (applySocketValue(v.path, v.value, update.source, update.timestamp)) changed = true;
            }
          }
          console.debug('[CZone WS] delta received', { valuesSeen, circuitValues, changed, updateSource: msg.updates.map(u => u.source || null), updateTimestamp: msg.updates.map(u => u.timestamp || null), timestamp: new Date(lastSocketUpdateAt).toISOString() });
          updateSocketIndicator(circuitValues ? 'Connected · CZone updates live' : 'Connected · WebSocket live', true);
          scheduleWatchdog();
          if (changed) liveRender();
        } catch (e) { console.debug('[CZone WS] message parse error', e); }
      };
      socket.onclose = () => {
        socketConnected = false;
        updateSocketIndicator('Reconnecting to Signal K…', false);
        console.warn('[CZone WS] closed; reconnecting');
        clearTimeout(socketReconnectTimer);
        socketReconnectTimer = setTimeout(connectSocket, 3000);
        lastSocketUpdateAt = 0;
        scheduleWatchdog();
      };
      socket.onerror = e => { console.warn('[CZone WS] error', e); try { socket.close(); } catch (_) {} };
    } catch (e) { console.warn('[CZone WS] connect failed', e); }
  }

  refreshVesselName();
  refreshOnce('initial-load').then(() => sendSubscriptions());
  connectSocket();

})();
</script>
<script src="monitor.js"></script>
</body>
</html>
